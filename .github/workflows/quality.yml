name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.4
  DART_VERSION: 3.11.1
  FLUTTER_REVISION: ff37bef603469fb030f2b72995ab929ccfc227f0
  JAVA_VERSION: 17.0.20+8

jobs:
  quality:
    name: Analyze, test, web, Android debug
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Java SDK
        env:
          # https://github.com/adoptium/temurin17-binaries/releases/tag/jdk-17.0.20%2B8
          JAVA_ARCHIVE: OpenJDK17U-jdk_x64_linux_hotspot_17.0.20_8.tar.gz
          JAVA_ARCHIVE_SHA256: be7668bc030d578b83d6d5ef9221d6d6729bbbca8cf94a7d52e16ac68b5a5a35
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/temurin-jdk.tar.gz"
          install_root="$RUNNER_TEMP/temurin-jdk"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.20%2B8/$JAVA_ARCHIVE" \
            --output "$archive"
          printf '%s  %s\n' "$JAVA_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root" --strip-components=1
          rm -f "$archive"
          printf '%s\n' "$install_root/bin" >> "$GITHUB_PATH"
          printf 'JAVA_HOME=%s\n' "$install_root" >> "$GITHUB_ENV"

      - name: Install verified Flutter SDK
        env:
          # https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
          FLUTTER_ARCHIVE: stable/linux/flutter_linux_3.41.4-stable.tar.xz
          FLUTTER_ARCHIVE_SHA256: c9c4e741ebcf83ee88303404176f7e22c3b6abfc8e9d60781098b6d4104327a9
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter-sdk.tar.xz"
          install_root="$RUNNER_TEMP/flutter-sdk"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 \
            "https://storage.googleapis.com/flutter_infra_release/releases/$FLUTTER_ARCHIVE" \
            --output "$archive"
          printf '%s  %s\n' "$FLUTTER_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xJf "$archive" -C "$install_root"
          rm -f "$archive"
          printf '%s\n' "$install_root/flutter/bin" >> "$GITHUB_PATH"
          printf 'FLUTTER_ROOT=%s\n' "$install_root/flutter" >> "$GITHUB_ENV"

      - name: Verify SDK versions
        run: |
          set -euo pipefail
          actual_flutter="$(flutter --version --machine | jq -r '.frameworkVersion')"
          actual_dart="$(dart --version 2>&1)"
          actual_revision="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          actual_java="$(java -version 2>&1)"
          test "$actual_flutter" = "$FLUTTER_VERSION"
          test "$actual_revision" = "$FLUTTER_REVISION"
          grep -F "Dart SDK version: $DART_VERSION " <<<"$actual_dart"
          grep -F "Temurin-$JAVA_VERSION" <<<"$actual_java"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify generated code
        run: |
          set -euo pipefail
          dart run build_runner build
          mapfile -t generated_files < <(git ls-files -- ':(glob)**/*.g.dart')
          git diff --exit-code -- "${generated_files[@]}"

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings

      - name: Run tests serially
        run: flutter test --no-pub --concurrency=1

      - name: Build web release
        run: flutter build web --release --no-pub --no-web-resources-cdn

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Verify source tree is unchanged
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            printf '%s\n' "$untracked"
            exit 1
          fi

  windows:
    name: Windows desktop and SQLite FFI
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Flutter SDK
        env:
          # https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json
          FLUTTER_ARCHIVE: stable/windows/flutter_windows_3.41.4-stable.zip
          FLUTTER_ARCHIVE_SHA256: c52c4f54691001df18b07ef892908437275ba29b337d802f64768a910c8223ad
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'flutter-sdk.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'flutter-sdk'
          $uri = "https://storage.googleapis.com/flutter_infra_release/releases/$env:FLUTTER_ARCHIVE"
          curl.exe --fail --location --silent --show-error --proto '=https' --tlsv1.2 --output $archive $uri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FLUTTER_ARCHIVE_SHA256) {
            throw "Flutter SDK archive checksum mismatch."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot
          Remove-Item -LiteralPath $archive -Force
          $flutterRoot = Join-Path $installRoot 'flutter'
          (Join-Path $flutterRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FLUTTER_ROOT=$flutterRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify SDK versions
        run: |
          $flutterVersion = (flutter --version --machine | ConvertFrom-Json).frameworkVersion
          if ($flutterVersion -ne $env:FLUTTER_VERSION) {
            throw "Expected Flutter $env:FLUTTER_VERSION, got $flutterVersion."
          }
          $flutterRevision = git -C $env:FLUTTER_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($flutterRevision -ne $env:FLUTTER_REVISION) {
            throw "Unexpected Flutter SDK revision."
          }
          $dartVersion = dart --version 2>&1
          if ($dartVersion -notmatch "Dart SDK version: $([regex]::Escape($env:DART_VERSION)) ") {
            throw "Expected Dart $env:DART_VERSION."
          }

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test SQLite FFI persistence and migrations
        run: >-
          flutter test --no-pub --concurrency=1
          test/features/notes/data/datasources/local_note_datasource_test.dart
          test/features/notes/data/datasources/local_note_datasource_migration_test.dart
          test/features/notes/data/datasources/reminder_outbox_datasource_test.dart
          test/features/notes/data/reminder_outbox_process_death_test.dart

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Verify source tree is unchanged
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $untracked = @(git ls-files --others --exclude-standard)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($untracked.Count -ne 0) {
            $untracked | Write-Output
            exit 1
          }
